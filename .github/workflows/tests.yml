name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pure + HA Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Pure unit tests (parser, scoring)
        run: python -m pytest tests/ --ignore=tests/ha --ignore=tests/hass -v

      - name: HA integration tests (api, config_flow, coordinator, sensor)
        run: python -m pytest tests/ha/ -v
